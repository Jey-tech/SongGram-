<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SongGram 2030</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #050510;
      --neon-blue: #00f0ff;
      --neon-purple: #9d00ff;
      --neon-pink: #ff00ea;
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-sub: #8892b0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(157, 0, 255, 0.15), transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.15), transparent 40%);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      margin: 0;
      padding: 70px 20px 30px 20px; 
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh; 
      overflow: hidden; /* جلوگیری از اسکرول صفحه اصلی */
      box-sizing: border-box;
      position: relative;
      direction: ltr;
    }

    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
      pointer-events: none;
      z-index: 10;
    }

    .header { width: 100%; text-align: center; margin-bottom: 25px; z-index: 2; }
    
    .header h1 { 
      margin: 0; 
      font-family: 'Orbitron', sans-serif;
      font-size: 28px; 
      font-weight: 900; 
      background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 3px;
      text-transform: uppercase;
      filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
    }
    
    .header p { margin: 8px 0 0 0; color: var(--text-sub); font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    
    .player-card {
      background: var(--glass-bg);
      width: 100%;
      max-width: 340px;
      border-radius: 32px;
      padding: 25px;
      box-shadow: 
        0 20px 50px rgba(0,0,0,0.6),
        inset 0 0 0 1px var(--glass-border);
      text-align: center;
      box-sizing: border-box;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 2;
      animation: float 6s ease-in-out infinite;
      display: flex;
      flex-direction: column;
      margin-bottom: 20px; 
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 15px;
      padding: 0 10px;
      z-index: 5;
    }

    .action-icon {
      width: 28px;
      height: 28px;
      stroke: var(--text-sub);
      fill: none;
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .action-icon.favorited {
      stroke: var(--neon-pink);
      fill: rgba(255, 0, 234, 0.2);
      filter: drop-shadow(0 0 10px var(--neon-pink));
      transform: scale(1.2);
    }
    
    .action-icon:active { transform: scale(0.9); }

    .cover-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      box-shadow: 
        0 0 30px rgba(0, 240, 255, 0.2),
        0 0 60px rgba(157, 0, 255, 0.1),
        inset 0 0 20px rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,0.05);
    }

    .disc {
      width: 60%;
      height: 60%;
      border-radius: 50%;
      background: radial-gradient(circle, #000 20%, #111 80%);
      position: relative;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 20px var(--neon-purple), 0 0 20px var(--neon-blue);
    }
    
    .disc::before {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 2px dashed rgba(0, 240, 255, 0.3);
      animation: spin 20s linear infinite reverse;
    }

    .disc::after {
      content: '';
      width: 20%;
      height: 20%;
      background: var(--neon-blue);
      border-radius: 50%;
      box-shadow: 0 0 15px var(--neon-blue);
    }

    .disc.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .song-title { 
      font-family: 'Orbitron', sans-serif;
      font-size: 18px; 
      font-weight: 700; 
      margin-bottom: 8px; 
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .artist-name { 
      color: var(--neon-blue); 
      font-size: 15px; 
      font-weight: 600;
      margin-bottom: 20px; 
      letter-spacing: 1px; 
      opacity: 0.8; 
    }
    
    .progress-container {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      margin-bottom: 25px;
      font-size: 14px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }
    
    .progress-bar {
      flex-grow: 1;
      -webkit-appearance: none;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
    }
    
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--neon-blue);
      box-shadow: 0 0 15px var(--neon-blue), 0 0 30px var(--neon-blue);
      transition: transform 0.1s;
    }
    .progress-bar::-webkit-slider-thumb:active { transform: scale(1.3); }
    
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }
    
    .control-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    
    .control-btn svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--text-main);
      stroke-width: 2;
      stroke-linejoin: round;
      opacity: 0.7;
      transition: all 0.3s;
    }

    .control-btn:active svg {
      opacity: 1;
      stroke: var(--neon-blue);
      filter: drop-shadow(0 0 10px var(--neon-blue));
      transform: scale(0.9);
    }

    .play-btn {
      background: transparent;
      border: 2px solid var(--neon-blue);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(0, 240, 255, 0.1);
      transition: all 0.2s;
      position: relative;
    }
    
    .play-btn svg {
      width: 35px;
      height: 35px;
      fill: var(--neon-blue);
      filter: drop-shadow(0 0 5px var(--neon-blue));
      transition: all 0.3s;
    }

    .play-btn:active { 
      transform: scale(0.95); 
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), inset 0 0 25px rgba(0, 240, 255, 0.4); 
    }
    
    .play-btn.pulsing { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0.4); }
      70% { box-shadow: 0 0 0 15px rgba(0, 240, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 240, 255, 0); }
    }

    /* --- استایل‌های مربوط به منوی پلی‌لیست --- */
    .playlist-overlay {
      position: fixed;
      top: 100%; /* از پایین صفحه شروع میشه */
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(157, 0, 255, 0.15), transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.15), transparent 50%);
      z-index: 100;
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      padding: 70px 20px 30px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    .playlist-overlay.open {
      top: 0;
    }

    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid rgba(255,255,255,0.1);
      padding-bottom: 15px;
    }

    .playlist-header h2 {
      font-family: 'Orbitron', sans-serif;
      margin: 0;
      color: var(--neon-blue);
      font-size: 22px;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 24px;
      cursor: pointer;
      opacity: 0.7;
    }
    .close-btn:active { opacity: 1; color: var(--neon-pink); }

    .playlist-items {
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* استایل هر آهنگ در لیست */
    .playlist-item {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 15px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s;
    }

    .playlist-item:active {
      background: rgba(255, 255, 255, 0.08);
      transform: scale(0.98);
    }

    .playlist-item .p-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      color: var(--text-main);
      margin-bottom: 5px;
    }

    .playlist-item .p-artist {
      font-size: 14px;
      color: var(--text-sub);
    }

    /* آهنگی که در حال پخشه، هایلایت میشه */
    .playlist-item.active {
      border-color: var(--neon-pink);
      box-shadow: 0 0 15px rgba(255, 0, 234, 0.2);
    }
    .playlist-item.active .p-title {
      color: var(--neon-pink);
      text-shadow: 0 0 8px rgba(255, 0, 234, 0.5);
    }
    .playlist-item.active .p-artist {
      color: var(--neon-pink);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>SongGram</h1>
    <p id="welcome-text">Connecting to network...</p>
  </div>

  <div class="player-card">
    <div class="top-actions">
      <!-- Playlist Icon (حالا کلیک پذیر شده) -->
      <svg class="action-icon" viewBox="0 0 24 24" onclick="togglePlaylist()">
        <path d="M4 6h16M4 12h12M4 18h16" stroke-linecap="square"/>
        <circle cx="20" cy="12" r="1.5" fill="currentColor"/>
      </svg>
      <!-- Heart Icon -->
      <svg class="action-icon" id="favIcon" viewBox="0 0 24 24" onclick="toggleFavorite()">
        <path d="M12 21 L3 12 L8 7 L12 11 L16 7 L21 12 Z" stroke-linejoin="miter"/>
      </svg>
    </div>

    <div class="cover-container">
      <div class="disc" id="disc"></div>
    </div>
    
    <div class="song-title" id="title">Trending Track</div>
    <div class="artist-name" id="artist">Artist Name</div>
    
    <div class="progress-container">
      <span id="curr-time">0:00</span>
      <input type="range" class="progress-bar" id="progress" value="0" min="0" max="100" step="0.1">
      <span id="total-time">0:00</span>
    </div>
    
    <div class="controls">
      <button class="control-btn" onclick="prevTrack()">
        <svg viewBox="0 0 24 24">
          <path d="M19 20 L9 12 L19 4 Z" />
          <line x1="5" y1="4" x2="5" y2="20" />
        </svg>
      </button>
      
      <button class="play-btn pulsing" id="playBtn" onclick="togglePlay()">
        <svg id="playIcon" viewBox="0 0 24 24">
          <path d="M7 4 L19 12 L7 20 Z" />
        </svg>
      </button>
      
      <button class="control-btn" onclick="nextTrack()">
        <svg viewBox="0 0 24 24">
          <path d="M5 4 L15 12 L5 20 Z" />
          <line x1="19" y1="4" x2="19" y2="20" />
        </svg>
      </button>
    </div>
  </div>

  <!-- منوی کشویی پلی‌لیست -->
  <div class="playlist-overlay" id="playlistOverlay">
    <div class="playlist-header">
      <h2>Playlist</h2>
      <button class="close-btn" onclick="togglePlaylist()">✕</button>
    </div>
    <div class="playlist-items" id="playlistItems">
      <!-- آهنگ‌ها با جاوااسکریپت اینجا ساخته میشن -->
    </div>
  </div>

  <audio id="audio" src=""></audio>

  <script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#050510'); 

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('welcome-text').innerText = `Welcome, ${user.first_name}`;
    } else {
      document.getElementById('welcome-text').innerText = `Welcome, Guest`;
    }

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const disc = document.getElementById('disc');
    const progress = document.getElementById('progress');
    const currTime = document.getElementById('curr-time');
    const totalTime = document.getElementById('total-time');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const favIcon = document.getElementById('favIcon');
    const playlistOverlay = document.getElementById('playlistOverlay');
    const playlistItemsContainer = document.getElementById('playlistItems');

    const SVG_PLAY = '<path d="M7 4 L19 12 L7 20 Z" />';
    const SVG_PAUSE = '<path d="M6 4 h4 v16 h-4 Z M14 4 h4 v16 h-4 Z" />';

    const playlist = [
      { id: 1, title: "Neon Sound", artist: "Cyber Maker", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { id: 2, title: "The Matrix", artist: "Hologram DJ", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { id: 3, title: "Space Journey", artist: "Galaxy", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" },
      { id: 4, title: "Cyberpunk City", artist: "Synthwave", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" }
    ];
    let trackIndex = 0;

    let favorites = JSON.parse(localStorage.getItem('songgram_favs')) || [];

    // تابع ساخت لیست آهنگ‌ها در منو
    function renderPlaylist() {
      playlistItemsContainer.innerHTML = ''; // پاک کردن لیست قبلی
      
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        // اگر آهنگ در حال پخش بود، کلاس active بگیره
        item.className = `playlist-item ${index === trackIndex ? 'active' : ''}`;
        item.innerHTML = `
          <div>
            <div class="p-title">${song.title}</div>
            <div class="p-artist">${song.artist}</div>
          </div>
        `;
        // وقتی روی آهنگ کلیک شد
        item.onclick = () => {
          trackIndex = index;
          loadTrack(trackIndex);
          playTrack();
          togglePlaylist(); // بستن منو
        };
        playlistItemsContainer.appendChild(item);
      });
    }

    // باز و بسته کردن منو
    function togglePlaylist() {
      tg.HapticFeedback.impactOccurred('medium');
      playlistOverlay.classList.toggle('open');
      if (playlistOverlay.classList.contains('open')) {
        renderPlaylist(); // هر بار که باز شد لیست آپدیت بشه
      }
    }

    function loadTrack(index) {
      audio.src = playlist[index].src;
      title.innerText = playlist[index].title;
      artist.innerText = playlist[index].artist;
      progress.value = 0;
      updateFavoriteIcon();
    }

    function updateFavoriteIcon() {
      const currentTrackId = playlist[trackIndex].id;
      if (favorites.includes(currentTrackId)) {
        favIcon.classList.add('favorited');
      } else {
        favIcon.classList.remove('favorited');
      }
    }

    function toggleFavorite() {
      tg.HapticFeedback.impactOccurred('medium');
      const currentTrackId = playlist[trackIndex].id;
      
      if (favorites.includes(currentTrackId)) {
        favorites = favorites.filter(id => id !== currentTrackId);
      } else {
        favorites.push(currentTrackId);
      }
      
      localStorage.setItem('songgram_favs', JSON.stringify(favorites));
      updateFavoriteIcon();
    }

    function playTrack() {
      audio.play();
      playIcon.innerHTML = SVG_PAUSE;
      playBtn.classList.remove('pulsing');
      disc.classList.add('playing');
    }

    function pauseTrack() {
      audio.pause();
      playIcon.innerHTML = SVG_PLAY;
      playBtn.classList.add('pulsing');
      disc.classList.remove('playing');
    }

    function togglePlay() {
      tg.HapticFeedback.impactOccurred('heavy');
      if (audio.paused) {
        playTrack();
      } else {
        pauseTrack();
      }
    }

    function nextTrack() {
      trackIndex = (trackIndex + 1) % playlist.length;
      loadTrack(trackIndex);
      playTrack();
      tg.HapticFeedback.impactOccurred('light');
    }

    function prevTrack() {
      trackIndex = (trackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(trackIndex);
      playTrack();
      tg.HapticFeedback.impactOccurred('light');
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progress.value = percent || 0;
      currTime.innerText = formatTime(audio.currentTime);
      totalTime.innerText = formatTime(audio.duration);
    });

    progress.addEventListener('input', () => {
      const time = (progress.value / 100) * audio.duration;
      audio.currentTime = time;
    });

    audio.addEventListener('ended', nextTrack);
    loadTrack(trackIndex);
  </script>
</body>
</html>
