<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SongGram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-grad-1: #e0e7ff;
      --bg-grad-2: #fae8ff;
      --bg-grad-3: #e0f2fe;
      --primary: #8b5cf6;
      --primary-light: #c4b5fd;
      --text-dark: #1e1b4b;
      --text-light: #6b7280;
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(255, 255, 255, 0.8);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      
      --nav-height: 65px;
      --mini-player-height: 60px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
      direction: ltr;
    }

    /* --- هدر --- */
    .app-header {
      position: absolute;
      top: 0; left: 0; width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      padding-top: calc(15px + env(safe-area-inset-top, 0px));
      z-index: 20;
      background: transparent;
    }

    .logo {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(90deg, #8b5cf6, #d946ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .profile-btn { 
      width: 40px; height: 40px; 
      display: flex; justify-content: center; align-items: center; 
      cursor: pointer; border-radius: 50%; 
      background: var(--glass-bg); border: 1px solid var(--glass-border); 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .profile-btn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }

    /* --- محتوای اصلی --- */
    .app-content {
      position: absolute;
      top: calc(75px + env(safe-area-inset-top, 0px)); /* فاصله از هدر */
      bottom: calc(var(--nav-height) + 10px + env(safe-area-inset-bottom, 0px)); /* فاصله از نوار پایین */
      left: 0; right: 0;
      overflow-y: auto;
      padding: 0 20px;
      z-index: 10;
    }
    
    .app-content::-webkit-scrollbar { display: none; }

    .view-section {
      display: none;
      height: 100%;
    }
    .view-section.active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- صفحه اصلی (Home = Player) --- */
    #home-view {
      justify-content: center;
      align-items: center;
      padding-bottom: 20px;
    }

    .album-art-container {
      width: 70vw; 
      max-width: 260px;
      aspect-ratio: 1/1; 
      border-radius: 50%; 
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(139, 92, 246, 0.3); 
      margin-bottom: 25px; 
      position: relative;
      border: 4px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }
    
    .album-art-placeholder { 
      width: 100%; height: 100%; 
      display: flex; justify-content: center; align-items: center; 
      background: linear-gradient(45deg, #a78bfa, #f472b6); 
    }
    .album-art-placeholder svg { width: 80px; height: 80px; fill: white; opacity: 0.4; }
    
    .album-art-container.playing { animation: spin 15s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .player-info { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 300px; margin-bottom: 20px; }
    .player-info-text { text-align: left; overflow: hidden; }
    .player-info-text h2 { margin: 0 0 5px 0; font-size: 20px; color: var(--text-dark); font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
    .player-info-text p { margin: 0; font-size: 14px; color: var(--text-light); font-weight: 600; }
    
    .heart-btn { background: var(--glass-bg); border: 1px solid var(--glass-border); width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.05);}
    .heart-btn svg { width: 20px; height: 20px; stroke: var(--text-light); fill: none; transition: all 0.3s; }
    .heart-btn.active { background: #fce7f3; border-color: #fbcfe8; }
    .heart-btn.active svg { stroke: #db2777; fill: #db2777; }

    .player-progress { width: 100%; max-width: 300px; margin-bottom: 25px; }
    .progress-bar-container { height: 6px; background: rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; margin-bottom: 10px; position: relative; }
    .progress-fill { height: 100%; background: var(--primary); width: 0%; border-radius: 10px; }
    .progress-time { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-light); font-weight: 600; }
    input[type=range].seek-slider { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; margin: 0; }

    .player-controls { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 300px; padding: 0 5px; }
    .control-btn { background: transparent; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; padding: 5px; }
    .control-btn svg { width: 26px; height: 26px; fill: var(--text-light); }
    .play-pause-btn { width: 65px; height: 65px; background: var(--text-dark); border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    .play-pause-btn svg { width: 28px; height: 28px; fill: white; }
    .play-pause-btn svg.play-icon { margin-left: 4px; }

    /* --- صفحه کتابخانه (Library) --- */
    .lib-header { margin-bottom: 20px; margin-top: 10px; }
    .lib-header h1 { margin: 0; font-size: 22px; color: var(--text-dark); }
    
    .song-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px;}
    .song-item {
      display: flex; align-items: center; gap: 15px;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      padding: 10px; border-radius: 16px; cursor: pointer; transition: all 0.2s;
    }
    .song-item:active { transform: scale(0.98); background: rgba(255,255,255,0.8); }
    .song-cover { width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; flex-shrink: 0;}
    .song-cover svg { width: 20px; height: 20px; fill: white; }
    .song-info { flex-grow: 1; text-align: left; overflow: hidden; }
    .song-info h4 { margin: 0 0 4px 0; font-size: 13px; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
    .song-info p { margin: 0; font-size: 11px; color: var(--text-light); font-weight: 500; }
    .play-small-btn { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; border: none; flex-shrink: 0; }
    .play-small-btn svg { width: 14px; height: 14px; fill: var(--primary); margin-left: 2px; }

    /* --- مینی پلیر (Mini Player) --- */
    .mini-player {
      position: absolute;
      bottom: calc(var(--nav-height) + 10px + env(safe-area-inset-bottom, 0px));
      left: 15px;
      right: 15px;
      height: var(--mini-player-height);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0.3) 100%);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      display: flex; align-items: center; padding: 0 10px; gap: 12px;
      transform: translateY(200%); 
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 30;
      cursor: pointer;
    }
    .mini-player.show { transform: translateY(0); }

    .mini-progress-bg {
      position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: rgba(0,0,0,0.05); border-radius: 18px 18px 0 0; overflow: hidden;
    }
    .mini-progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }

    .mini-cover {
      width: 40px; height: 40px; border-radius: 10px;
      display: flex; justify-content: center; align-items: center; flex-shrink: 0;
    }
    .mini-cover svg { width: 18px; height: 18px; fill: white; }
    
    .mini-info { flex-grow: 1; overflow: hidden; text-align: left; }
    .mini-info h4 { margin: 0 0 2px 0; font-size: 13px; font-weight: 700; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mini-info p { margin: 0; font-size: 11px; color: var(--text-light); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .mini-play-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--primary); border: none; display: flex; justify-content: center; align-items: center;
      cursor: pointer; box-shadow: 0 4px 10px rgba(139, 92, 246, 0.3); flex-shrink: 0;
    }
    .mini-play-btn svg { width: 16px; height: 16px; fill: white; }
    .mini-play-btn svg.play-icon { margin-left: 2px; }

    /* --- نوار ناوبری پایین (Bottom Nav - 5 items) --- */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; width: 100%;
      height: calc(var(--nav-height) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 40;
    }

    .nav-item {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; transition: all 0.3s; padding: 8px 12px; border-radius: 15px;
    }
    .nav-item svg { width: 20px; height: 20px; fill: none; stroke: var(--text-light); stroke-width: 2; }
    .nav-item span { display: none; font-size: 10px; font-weight: 700; color: var(--text-light); }
    
    .nav-item.active { background: var(--primary); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); flex-direction: row; padding: 10px 15px; gap: 6px; }
    .nav-item.active svg { stroke: white; }
    .nav-item.active span { display: block; color: white; }

  </style>
</head>
<body>

  <header class="app-header">
    <div class="logo" onclick="switchTab('home', document.getElementById('nav-home'))">SONGGRAM</div>
    <div class="profile-btn"><img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=Jey" alt="User"></div>
  </header>

  <main class="app-content" id="mainContent">
    
    <!-- صفحه اصلی (پلیر) -->
    <section id="home-view" class="view-section active">
      <div class="album-art-container" id="fullPlayerCover">
        <div class="album-art-placeholder" id="coverArtPlaceholder">
           <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
      </div>

      <div class="player-info">
        <div class="player-info-text">
          <h2 id="player-title">Song Title</h2>
          <p id="player-artist">Artist</p>
        </div>
        <button class="heart-btn" id="player-heart" onclick="toggleLike()">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>

      <div class="player-progress">
        <div class="progress-bar-container">
          <div class="progress-fill" id="player-progress-fill"></div>
          <input type="range" class="seek-slider" id="seekSlider" value="0" min="0" max="100" step="0.1">
        </div>
        <div class="progress-time">
          <span id="player-curr-time">0:00</span>
          <span id="player-total-time">0:00</span>
        </div>
      </div>

      <div class="player-controls">
        <button class="control-btn"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
        <button class="control-btn" onclick="prevTrack()"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 19V5"/></svg></button>
        <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()">
          <svg class="play-icon" id="mainPlayIcon" viewBox="0 0 24 24"><path d="M7 4 L19 12 L7 20 Z" /></svg>
        </button>
        <button class="control-btn" onclick="nextTrack()"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 5v14"/></svg></button>
        <button class="control-btn"><svg viewBox="0 0 24 24"><path d="M17 2.1l4 4-4 4"/><path d="M3 12.2v-1a9 9 0 0 1 9-9h8.1"/><path d="M7 21.9l-4-4 4-4"/><path d="M21 11.8v1a9 9 0 0 1-9 9H3.9"/></svg></button>
      </div>
    </section>

    <!-- صفحه لایبرری -->
    <section id="library-view" class="view-section">
      <div class="lib-header"><h1>My Library</h1></div>
      <div class="song-list" id="song-list-container"></div>
    </section>

    <section id="tasks-view" class="view-section"><h2 style="text-align:center; margin-top:50px;">Tasks coming soon...</h2></section>
    <section id="earn-view" class="view-section"><h2 style="text-align:center; margin-top:50px;">Earn coming soon...</h2></section>
    <section id="profile-view" class="view-section"><h2 style="text-align:center; margin-top:50px;">Profile coming soon...</h2></section>

  </main>

  <!-- مینی پلیر -->
  <div class="mini-player" id="miniPlayer" onclick="switchTab('home', document.getElementById('nav-home'))">
    <div class="mini-progress-bg">
      <div class="mini-progress-fill" id="miniProgressFill"></div>
    </div>
    <div class="mini-cover" id="miniCover">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    </div>
    <div class="mini-info">
      <h4 id="miniTitle">Song Title</h4>
      <p id="miniArtist">Artist</p>
    </div>
    <button class="mini-play-btn" id="miniPlayBtn" onclick="togglePlayFromMini(event)">
      <svg id="miniPlayIcon" class="play-icon" viewBox="0 0 24 24"><path d="M7 4 L19 12 L7 20 Z" /></svg>
    </button>
  </div>

  <!-- نوار ناوبری پایین -->
  <nav class="bottom-nav">
    <div class="nav-item active" id="nav-home" onclick="switchTab('home', this)">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>Home</span>
    </div>
    <div class="nav-item" id="nav-library" onclick="switchTab('library', this)">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
      <span>Library</span>
    </div>
    <div class="nav-item" id="nav-tasks" onclick="switchTab('tasks', this)">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      <span>Tasks</span>
    </div>
    <div class="nav-item" id="nav-earn" onclick="switchTab('earn', this)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v12M15 9.5c0-1.5-1.5-2.5-3-2.5s-3 1-3 2.5 1.5 2.5 3 2.5 3 1 3 2.5-1.5 2.5-3 2.5-3-1-3-2.5"></path></svg>
      <span>Earn</span>
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchTab('profile', this)">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span>Profile</span>
    </div>
  </nav>

  <audio id="audioElement"></audio>

  <script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#e0e7ff'); 
    tg.setBackgroundColor('#e0e7ff');
    
    // گرفتن اطلاعات کاربر و عکسش
    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('user-avatar').src = user.photo_url || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user.first_name}`;
    }

    const allSongs = [
      { id: 1, title: "Blinding Lights", artist: "The Weeknd", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", coverColor: "linear-gradient(45deg, #c4b5fd, #f9a8d4)" },
      { id: 2, title: "Peaches", artist: "Justin Bieber", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", coverColor: "linear-gradient(45deg, #fca5a5, #fbbf24)" },
      { id: 3, title: "Neon Sound", artist: "Cyber Maker", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3", coverColor: "linear-gradient(45deg, #6ee7b7, #3b82f6)" },
      { id: 4, title: "Space Journey", artist: "Galaxy", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", coverColor: "linear-gradient(45deg, #1e1b4b, #8b5cf6)" }
    ];

    const songListContainer = document.getElementById('song-list-container');
    allSongs.forEach((song, index) => {
      const el = document.createElement('div');
      el.className = 'song-item';
      el.innerHTML = `
        <div class="song-cover" style="background: ${song.coverColor};">
          <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="song-info">
          <h4>${song.title}</h4>
          <p>${song.artist}</p>
        </div>
        <button class="play-small-btn"><svg viewBox="0 0 24 24"><path d="M7 4 L19 12 L7 20 Z" /></svg></button>
      `;
      el.onclick = () => {
        currentTrackIndex = index;
        loadTrackAndPlay();
        switchTab('home', document.getElementById('nav-home'));
      };
      songListContainer.appendChild(el);
    });

    const audio = document.getElementById('audioElement');
    
    const mainPlayIcon = document.getElementById('mainPlayIcon');
    const playerTitle = document.getElementById('player-title');
    const playerArtist = document.getElementById('player-artist');
    const playerHeart = document.getElementById('player-heart');
    const fullPlayerCover = document.getElementById('fullPlayerCover');
    const seekSlider = document.getElementById('seekSlider');
    const progressFill = document.getElementById('player-progress-fill');
    const currTimeEl = document.getElementById('player-curr-time');
    const totalTimeEl = document.getElementById('player-total-time');

    const miniPlayer = document.getElementById('miniPlayer');
    const miniTitle = document.getElementById('miniTitle');
    const miniArtist = document.getElementById('miniArtist');
    const miniCover = document.getElementById('miniCover');
    const miniPlayIcon = document.getElementById('miniPlayIcon');
    const miniProgressFill = document.getElementById('miniProgressFill');

    const SVG_PLAY = '<path d="M7 4 L19 12 L7 20 Z" />';
    const SVG_PAUSE = '<path d="M6 4h4v16H6zM14 4h4v16h-4z" />';

    let currentTrackIndex = 0;
    let isPlaying = false;
    let likedSongs = JSON.parse(localStorage.getItem('sg_likes')) || [];
    let currentTab = 'home';

    function loadTrackAndPlay() {
      const song = allSongs[currentTrackIndex];
      playerTitle.innerText = song.title;
      playerArtist.innerText = song.artist;
      fullPlayerCover.style.background = song.coverColor;
      miniTitle.innerText = song.title;
      miniArtist.innerText = song.artist;
      miniCover.style.background = song.coverColor;
      
      audio.src = song.src;
      playAudio();
      updateHeartIcon(song.id);
    }

    function playAudio() {
      audio.play();
      isPlaying = true;
      mainPlayIcon.innerHTML = SVG_PAUSE;
      miniPlayIcon.innerHTML = SVG_PAUSE;
      miniPlayIcon.classList.remove('play-icon');
      fullPlayerCover.classList.add('playing');
      updateMiniPlayerVisibility(); 
    }

    function pauseAudio() {
      audio.pause();
      isPlaying = false;
      mainPlayIcon.innerHTML = SVG_PLAY;
      miniPlayIcon.innerHTML = SVG_PLAY;
      miniPlayIcon.classList.add('play-icon');
      fullPlayerCover.classList.remove('playing');
      updateMiniPlayerVisibility(); 
    }

    function togglePlay() {
      tg.HapticFeedback.impactOccurred('heavy');
      if (!audio.src) { loadTrackAndPlay(); return; }
      if (isPlaying) pauseAudio();
      else playAudio();
    }

    function togglePlayFromMini(event) {
      event.stopPropagation(); 
      togglePlay();
    }

    function nextTrack() {
      currentTrackIndex = (currentTrackIndex + 1) % allSongs.length;
      loadTrackAndPlay();
    }

    function prevTrack() {
      currentTrackIndex = (currentTrackIndex - 1 + allSongs.length) % allSongs.length;
      loadTrackAndPlay();
    }

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      seekSlider.value = percent;
      currTimeEl.innerText = formatTime(audio.currentTime);
      totalTimeEl.innerText = formatTime(audio.duration);
      miniProgressFill.style.width = `${percent}%`;
    });

    seekSlider.addEventListener('input', () => {
      if (!audio.duration) return;
      const time = (seekSlider.value / 100) * audio.duration;
      audio.currentTime = time;
    });

    audio.addEventListener('ended', nextTrack);

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function toggleLike() {
      tg.HapticFeedback.impactOccurred('medium');
      const id = allSongs[currentTrackIndex].id;
      if (likedSongs.includes(id)) {
        likedSongs = likedSongs.filter(songId => songId !== id);
        playerHeart.classList.remove('active');
      } else {
        likedSongs.push(id);
        playerHeart.classList.add('active');
      }
      localStorage.setItem('sg_likes', JSON.stringify(likedSongs));
    }

    function updateHeartIcon(id) {
      if (likedSongs.includes(id)) playerHeart.classList.add('active');
      else playerHeart.classList.remove('active');
    }

    function updateMiniPlayerVisibility() {
      if (isPlaying && currentTab !== 'home') {
        miniPlayer.classList.add('show');
      } else {
        miniPlayer.classList.remove('show');
      }
    }

    function switchTab(tabId, element) {
      tg.HapticFeedback.impactOccurred('light');
      currentTab = tabId;

      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      const target = document.getElementById(`${tabId}-view`);
      if(target) target.classList.add('active');

      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if(element) element.classList.add('active');

      updateMiniPlayerVisibility(); 
    }

    // مقداردهی اولیه
    const initialSong = allSongs[0];
    playerTitle.innerText = initialSong.title;
    playerArtist.innerText = initialSong.artist;
    fullPlayerCover.style.background = initialSong.coverColor;
    miniTitle.innerText = initialSong.title;
    miniArtist.innerText = initialSong.artist;
    miniCover.style.background = initialSong.coverColor;
    updateHeartIcon(initialSong.id);
  </script>
</body>
</html>
