<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SongGram</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* متغیرهای رنگی که به صورت خودکار از تلگرام خونده میشن */
    :root {
      --bg-color: var(--tg-theme-bg-color, #121212);
      --text-main: var(--tg-theme-text-color, #ffffff);
      --text-sub: var(--tg-theme-hint-color, #b3b3b3);
      --primary: var(--tg-theme-button-color, #1DB954);
      --primary-text: var(--tg-theme-button-text-color, #ffffff);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e1e1e);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
      transition: background-color 0.3s, color 0.3s;
    }

    .header { width: 100%; text-align: center; margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
    .header p { margin: 5px 0 0 0; color: var(--text-sub); font-size: 15px; }
    
    /* کارت اصلی با افکت شیشه‌ای (Glassmorphism) */
    .player-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 340px;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(128, 128, 128, 0.1);
    }
    
    /* کاور آلبوم مدرن (مربعی) */
    .cover-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--primary) 0%, #191414 100%);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* دیسک چرخان داخل کاور */
    .disc {
      width: 50%;
      height: 50%;
      border-radius: 50%;
      background: radial-gradient(circle, #333 30%, #111 70%);
      border: 2px solid rgba(255,255,255,0.1);
      position: relative;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .disc::after {
      content: '';
      width: 15%;
      height: 15%;
      background: var(--bg-color);
      border-radius: 50%;
      position: absolute;
    }

    .disc.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    .song-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist-name { color: var(--text-sub); font-size: 14px; margin-bottom: 20px; }
    
    /* نوار پیشرفت مدرن */
    .progress-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      margin-bottom: 25px;
      font-size: 12px;
      color: var(--text-sub);
      font-variant-numeric: tabular-nums;
    }
    
    .progress-bar {
      flex-grow: 1;
      -webkit-appearance: none;
      height: 6px;
      background: rgba(128, 128, 128, 0.3);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }
    
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-main);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
      transition: transform 0.1s;
    }
    .progress-bar::-webkit-slider-thumb:active { transform: scale(1.3); }
    
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
    }
    
    .control-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 22px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .control-btn:active { opacity: 1; transform: scale(0.9); }

    .play-btn {
      background-color: var(--primary);
      color: var(--primary-text);
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .play-btn:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <div class="header">
    <h1>SongGram</h1>
    <p id="welcome-text">در حال بارگذاری...</p>
  </div>

  <div class="player-card">
    <!-- کاور و دیسک چرخان -->
    <div class="cover-container">
      <div class="disc" id="disc"></div>
    </div>
    
    <div class="song-title" id="title">Trending Track</div>
    <div class="artist-name" id="artist">Artist Name</div>
    
    <div class="progress-container">
      <span id="curr-time">0:00</span>
      <input type="range" class="progress-bar" id="progress" value="0" min="0" max="100" step="0.1">
      <span id="total-time">0:00</span>
    </div>
    
    <div class="controls">
      <button class="control-btn" onclick="prevTrack()">⏮</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
      <button class="control-btn" onclick="nextTrack()">⏭</button>
    </div>
  </div>

  <audio id="audio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

  <script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // تغییر رنگ هدر تلگرام برای هماهنگی بیشتر (اختیاری)
    tg.setHeaderColor('secondary_bg_color');

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('welcome-text').innerText = `سلام ${user.first_name} عزیز! 👋`;
    } else {
      document.getElementById('welcome-text').innerText = `سلام کاربر عزیز!`;
    }

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const disc = document.getElementById('disc');
    const progress = document.getElementById('progress');
    const currTime = document.getElementById('curr-time');
    const totalTime = document.getElementById('total-time');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');

    const playlist = [
      { title: "آهنگ تست اول", artist: "هنرمند اول", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
      { title: "آهنگ تست دوم", artist: "هنرمند دوم", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
      { title: "آهنگ تست سوم", artist: "هنرمند سوم", src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
    ];
    let trackIndex = 0;

    function loadTrack(index) {
      audio.src = playlist[index].src;
      title.innerText = playlist[index].title;
      artist.innerText = playlist[index].artist;
      progress.value = 0;
    }

    function playTrack() {
      audio.play();
      playBtn.innerHTML = '⏸';
      disc.classList.add('playing');
    }

    function pauseTrack() {
      audio.pause();
      playBtn.innerHTML = '▶️';
      disc.classList.remove('playing');
    }

    function togglePlay() {
      tg.HapticFeedback.impactOccurred('medium');
      if (audio.paused) {
        playTrack();
      } else {
        pauseTrack();
      }
    }

    function nextTrack() {
      trackIndex = (trackIndex + 1) % playlist.length;
      loadTrack(trackIndex);
      playTrack();
      tg.HapticFeedback.impactOccurred('light');
    }

    function prevTrack() {
      trackIndex = (trackIndex - 1 + playlist.length) % playlist.length;
      loadTrack(trackIndex);
      playTrack();
      tg.HapticFeedback.impactOccurred('light');
    }

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    audio.addEventListener('timeupdate', () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progress.value = percent || 0;
      currTime.innerText = formatTime(audio.currentTime);
      totalTime.innerText = formatTime(audio.duration);
    });

    progress.addEventListener('input', () => {
      const time = (progress.value / 100) * audio.duration;
      audio.currentTime = time;
    });

    audio.addEventListener('ended', nextTrack);
    loadTrack(trackIndex);
  </script>
</body>
</html>
