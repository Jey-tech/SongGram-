<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Beif Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #1DB954;
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      box-sizing: border-box;
    }
    .header {
      width: 100%;
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      color: var(--primary);
    }
    .header p {
      margin: 5px 0 0 0;
      color: var(--text-sub);
      font-size: 14px;
    }
    .player-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
      box-sizing: border-box;
    }
    .cover-art {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: linear-gradient(45deg, #1DB954, #191414);
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.3);
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }
    .cover-art.playing {
      animation-play-state: running;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
    .song-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .artist-name {
      color: var(--text-sub);
      font-size: 14px;
      margin-bottom: 25px;
    }
    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .play-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      font-size: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
      transition: transform 0.1s;
    }
    .play-btn:active {
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Beif Music 🎧</h1>
    <p>پلیر اختصاصی تو در تلگرام</p>
  </div>

  <div class="player-card">
    <div class="cover-art" id="vinyl">💿</div>
    <div class="song-title">Trending Track</div>
    <div class="artist-name">Artist Name</div>
    
    <div class="controls">
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
    </div>
  </div>

  <script>
    let tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let isPlaying = false;
    const playBtn = document.getElementById('playBtn');
    const vinyl = document.getElementById('vinyl');

    function togglePlay() {
      isPlaying = !isPlaying;
      tg.HapticFeedback.impactOccurred('medium');

      if (isPlaying) {
        playBtn.innerHTML = '⏸️';
        vinyl.classList.add('playing');
      } else {
        playBtn.innerHTML = '▶️';
        vinyl.classList.remove('playing');
      }
    }
  </script>
</body>
</html>
